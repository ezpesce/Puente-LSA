name: Compilar APK de Puente LSA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Variante de APK a compilar"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle Wrapper & Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK 36 y licencias
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Instalar Android SDK 36.1 (minorApiLevel 1)
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true
          fi
          ls -la "$SDK_ROOT/platforms" || true

      - name: Definir tipo de compilación
        id: build-config
        shell: bash
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "Variant: release"
          else
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
            echo "Variant: debug"
          fi

      - name: Preparar keystore de firma
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.build-config.outputs.build_type }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "debug.keystore restaurado desde debug.keystore.base64"
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ "$BUILD_TYPE" = "release" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
              echo "::error::Para compilar en modo release debés configurar los secrets RELEASE_KEYSTORE_BASE64, STORE_PASSWORD y KEY_PASSWORD en GitHub."
              exit 1
            fi
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          fi

      - name: Configurar google-services.json (opcional desde Secret)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "app/google-services.json restaurado desde Secret GOOGLE_SERVICES_JSON"
          elif [ ! -f app/google-services.json ]; then
            echo "::notice::app/google-services.json no está presente en el repositorio; la APK compilará igual, pero para Google Sign-In y Firebase podés agregar el secret GOOGLE_SERVICES_JSON."
          fi

      - name: Preparar ejecutable Gradle 9.3.1
        id: gradle-bin
        shell: bash
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            sed -i 's/\r$//' gradlew || true
            chmod +x gradlew
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            curl -fsSL "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o "$RUNNER_TEMP/gradle-9.3.1.zip"
            unzip -q "$RUNNER_TEMP/gradle-9.3.1.zip" -d "$RUNNER_TEMP"
            chmod +x "$RUNNER_TEMP/gradle-9.3.1/bin/gradle"
            echo "cmd=$RUNNER_TEMP/gradle-9.3.1/bin/gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK (Debug o Release)
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.build-config.outputs.build_type }}
          GRADLE_CMD: ${{ steps.gradle-bin.outputs.cmd }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$GRADLE_CMD" --version
          if [ "$BUILD_TYPE" = "release" ]; then
            "$GRADLE_CMD" :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace
          else
            "$GRADLE_CMD" :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
          fi

      - name: Preparar APK para descarga
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.build-config.outputs.build_type }}
        run: |
          mkdir -p build-artifacts
          if [ "$BUILD_TYPE" = "release" ]; then
            cp app/build/outputs/apk/release/*.apk build-artifacts/Puente-LSA-release.apk
          else
            cp app/build/outputs/apk/debug/*.apk build-artifacts/Puente-LSA-debug.apk
          fi
          ls -lh build-artifacts/

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Puente-LSA-APK-${{ steps.build-config.outputs.build_type }}
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publicar APK en GitHub Release (si es un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          generate_release_notes: true

      - name: Resumen de descarga
        shell: bash
        run: |
          echo "### APK de Puente LSA compilada correctamente" >> "$GITHUB_STEP_SUMMARY"
          echo "- Descargala desde la sección **Artifacts** al final de esta ejecución en GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
